<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
    {% load static %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-md-6">
                <div class="text-center">
                    <h4>Budget List</h4>
                </div>
                <div class="table">
                    <table class="table table-bordered table-hover">
                        <thead>
                            <tr>
                                <th>BUDGET ID</th>
                                <th>ALLOCATION</th>
                                <th>USED</th>
                                <th>AVIALABLE</th>
                                <th>MONTH</th>
                                <th>ACTION</th>
                            </tr>
                        </thead>
                        <tbody id="bugBody"></tbody>

                    </table>
                    <div class="modal fade" id="bugModal" tabindex="-1">
                        <div class="modal-dialog">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h4 class="modal-title">Edit Budget</h4>
                                    <button class="btn-close" data-bs-dismiss="modal"></button>
                                </div>
                                <div class="modal-body">
                                    <input type="hidden" id="b_id">
                                    <div class="mt-3">
                                        <label for="e_bug_id">BUDGET ID</label>
                                        <input type="text" id="e_bug_id" class="form-control" placeholder="write emp id"
                                            required />
                                    </div>
                                    <div class="mt-3">
                                        <label for="e_bug_allocation">ALLOCATION</label>
                                        <input type="text" id="e_bug_allocation" class="form-control"
                                            placeholder="write emp name" required />
                                    </div>
                                    <div class="mt-3">
                                        <label for="e_bug_used">USED</label>
                                        <input type="text" id="e_bug_used" class="form-control"
                                            placeholder="write your designation" required />
                                    </div>
                                    <div class="mt-3">
                                        <label for="e_bug_avl">AVIALABLE</label>
                                        <input type="text" id="e_bug_avl" class="form-control"
                                            placeholder="amount of salary" required />
                                    </div>
                                    <div class="mt-3">
                                        <label for="e_bug_month">MONTH</label>
                                        <input type="text" id="e_bug_month" class="form-control"
                                            placeholder=" enter city name" required />
                                    </div>
                                    <div class="text-end">
                                        <label for="bug_update"></label>
                                        <button id="bug_update" class="btn btn-success mt-2">update</button>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>
</body>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="{% static 'table1/budget/bug_create.js' %}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

</html>
