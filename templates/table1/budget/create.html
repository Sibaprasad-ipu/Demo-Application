<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    {% load static %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-md-6">
                <div class="text-center">
                    <h4>Create Table</h4>
                </div>
                <input type="hidden" id="hidden_id">

                <div class="mt-3">
                    <lbael for="bug_id">BUDGET ID</lbael>
                    <input type="text" id="bug_id" class="form-control" placeholder="write budget id" required />
                </div>
                <div class="mt-3">
                    <lbael for="bug_allocation">ALLOCATION</lbael>
                    <input type="text" id="bug_allocation" class="form-control" placeholder="write amount" required />
                </div>
                <div class="mt-3">
                    <lbael for="bug_used">USED</lbael>
                    <input type="text" id="bug_used" class="form-control" placeholder="write  amount" required />
                </div>
                <div class="mt-3">
                    <lbael for="bug_avl">AVIALABLE</lbael>
                    <input type="text" id="bug_avl" class="form-control" placeholder="amount" readonly />
                </div>
                <div class="mt-3">
                    <lbael for="bug_month">MONTH</lbael>
                    <input type="text" id="bug_month" class="form-control" placeholder=" write month" required />
                </div>
                <div class="text-end">
                    <label for="bug_create"></label>
                    <button id="bug_create" class="btn btn-success mt-2">submit</button>
                </div>
            </div>
        </div>
    </div>
</body>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="{% static 'table1/budget/bug_create.js' %}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

</html>
