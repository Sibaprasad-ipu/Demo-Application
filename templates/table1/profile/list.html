<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile List</title>
    {% load static %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-md-8">
                <div class="text-center">
                    <h2 class="title">Profile List</h2>
                </div>
                <div class="table">
                    <table class="table table-bordered table-hover">
                        <thead>
                            <tr>
                                <th>NAME</th>
                                <th>EMAIL</th>
                                <th>PHONE NO.</th>
                                <th>CITY</th>
                                <th>STATE</th>
                                <th>COUNTRY</th>
                                <th>ACTION</th>
                            </tr>
                        </thead>
                        <tbody id="pbody"></tbody>
                    </table>
                    <div class="modal fade" id="profileModal" tabindex="-1">
                        <div class="modal-dialog">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h4 class="modal-title">EDIT PROFILE</h4>
                                    <button class="btn-close" data-bs-dismiss="modal"></button>
                                </div>
                                <div class="modal-body">
                                    <input type="hidden" id="p_id">
                                    <div class="mt-3">
                                        <label for="e_name">NAME</label>
                                        <input type="text" id="e_name" class="form-control" required />
                                    </div>
                                    <div class="mt-3">
                                        <label for="e_email">EMAIL</label>
                                        <input type="text" id="e_email" class="form-control" required />
                                    </div>
                                    <div class="mt-3">
                                        <label for="e_phone">PHONE NO</label>
                                        <input type="text" id="e_phone" class="form-control" required />
                                    </div>
                                    <div class="mt-3">
                                        <label for="e_city">CITY</label>
                                        <input type="text" id="e_city" class="form-control" required />
                                    </div>
                                    <div class="mt-3">
                                        <label for="e_state">STATE</label>
                                        <input type="text" id="e_state" class="form-control" required />
                                    </div>
                                    <div class="mt-3">
                                        <label for="e_country">COUNTRY</label>
                                        <input type="text" id="e_country" class="form-control" required />
                                    </div>
                                    <div class="text-end">
                                        <button id="p_update" class="btn btn-success mt-2">update</button>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="{% static 'table1/profiles/profile_create.js' %}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

</html>
