<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    {% load static %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-md-6">
                <div class="text-center">
                    <h4>Create Profile</h4>
                </div>
                <input type="hidden" id="p_id">

                <div class="mt-3">
                    <lbael for="p_name">NAME</lbael>
                    <input type="text" id="p_name" class="form-control" placeholder="write your name" required />
                </div>
                <div class="mt-3">
                    <lbael for="p_email">EMAIL</lbael>
                    <input type="text" id="p_email" class="form-control" placeholder="write email" required />
                </div>
                <div class="mt-3">
                    <lbael for="p_phone">PHONE NO.</lbael>
                    <input type="text" id="p_phone" class="form-control" placeholder="write phone no" required />
                </div>
                <div class="mt-3">
                    <lbael for="p_city">CITY</lbael>
                    <input type="text" id="p_city" class="form-control" placeholder="write city name" required />
                </div>
                <div class="mt-3">
                    <lbael for="p_state">STATE</lbael>
                    <input type="text" id="p_state" class="form-control" placeholder=" state name" required />
                </div>
                <div class="mt-3">
                    <lbael for="p_country">COUNTRY</lbael>
                    <input type="text" id="p_country" class="form-control" placeholder="country name" required />
                </div>
                <div class="text-end">
                    <label for="p_create"></label>
                    <button id="p_create" class="btn btn-success mt-2">submit</button>
                </div>
            </div>
        </div>
    </div>
</body>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="{% static 'table1/profiles/profile_create.js' %}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

</html>
