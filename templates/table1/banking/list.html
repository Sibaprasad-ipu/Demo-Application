<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
    {% load static %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-md-10">
                <div class="text-center">
                    <h4>Transaction List</h4>
                </div>
                <div class="table">
                    <table class="table table-bordered table-hover">
                        <thead>
                            <tr>
                                <th>NAME</th>
                                <th>ACCOUNT NUMBER</th>
                                <th>CREDIT</th>
                                <th>DEBIT</th>
                                <th>AVIALABLE</th>
                                <th>MODE</th>
                                <th>TIME</th>
                                <th>ACTION</th>
                            </tr>
                        </thead>
                        <tbody id="bankingBody"></tbody>

                    </table>
                    <div class="modal fade" id="bankingModal" tabindex="-1">
                        <div class="modal-dialog">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h4 class="modal-title">Edit Details</h4>
                                    <button class="btn-close" type="button" data-bs-dismiss="modal"></button>
                                </div>
                                <div class="modal-body">
                                    <input id="b_id" type="hidden">
                                    <div class="mt-3">
                                        <label for="name">NAME</label>
                                        <input type="text" id="name" class="form-control" placeholder="enter your name"
                                            required />
                                    </div>
                                    <div class="mt-3">
                                        <label for="ac_no">ACCOUNT NUMBER</label>
                                        <input type="text" id="ac_no" class="form-control"
                                            placeholder="enter account no" required />
                                    </div>
                                    <div class="mt-3">
                                        <label for="credit">CREDIT</label>
                                        <input type="text" id="credit" class="form-control" placeholder="write  amount"
                                            required />
                                    </div>
                                    <div class="mt-3">
                                        <label for="debit">DEBIT</label>
                                        <input type="text" id="debit" class="form-control" placeholder=" write amount"
                                            required />
                                    </div>
                                    <div class="mt-3">
                                        <input type="hidden" id="balance" class="form-control" placeholder="  avialable"
                                            readonly />
                                    </div>
                                    <div class="mt-3">
                                        <label for="mode">MODE</label>
                                        <input type="text" id="mode" class="form-control" placeholder="choose"
                                            required />
                                    </div>

                                    <div class="mt-3">
                                        <label for="time">TIME</label>
                                        <input type="datetime-local" id="time" class="form-control" required />
                                    </div>

                                    <div class="text-end">
                                        <label for="update"></label>
                                        <button id="update" class="btn btn-success mt-2">submit</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</body>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="{% static 'table1/banking/create.js' %}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

</html>
