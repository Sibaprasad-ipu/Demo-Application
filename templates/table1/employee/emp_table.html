<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
    {% load static %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-md-6">
                <div class="text-center">
                    <h4>Employee List</h4>
                </div>
                <div class="table">
                    <table class="table table-bordered table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>NAME</th>
                                <th>DESIGNATION</th>
                                <th>SALARY</th>
                                <th>CITY</th>
                                <th>ACTION</th>
                            </tr>
                        </thead>
                        <tbody id="empBody"></tbody>

                    </table>
                    <div class="modal fade" id="empModal" tabindex="-1">
                        <div class="modal-dialog">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h4 class="modal-title">Edit Modal</h4>
                                    <button class="btn-close" data-bs-dismiss="modal"></button>
                                </div>
                                <div class="modal-body">
                                    <input type="hidden" id="e_id">
                                    <div class="mt-3">
                                        <label for="e_emp_id"> ID</label>
                                        <input type="text" id="e_emp_id" class="form-control" placeholder="write emp id"
                                            required />
                                    </div>
                                    <div class="mt-3">
                                        <label for="e_emp_name"> NAME</label>
                                        <input type="text" id="e_emp_name" class="form-control"
                                            placeholder="write emp name" required />
                                    </div>
                                    <div class="mt-3">
                                        <label for="e_emp_degn">DESIGNATION</label>
                                        <input type="text" id="e_emp_degn" class="form-control"
                                            placeholder="write your designation" required />
                                    </div>
                                    <div class="mt-3">
                                        <label for="e_emp_salary">SALARY</label>
                                        <input type="text" id="e_emp_salary" class="form-control"
                                            placeholder="amount of salary" required />
                                    </div>
                                    <div class="mt-3">
                                        <label for="e_emp_city">CITY</label>
                                        <input type="text" id="e_emp_city" class="form-control"
                                            placeholder=" enter city name" required />
                                    </div>
                                    <div class="text-end">
                                        <label for="emp_update"></label>
                                        <button id="emp_update" class="btn btn-success mt-2">update</button>
                                    </div>

                                </div>
                            </div>
                        </div>
                    </div>

                </div>

            </div>
        </div>
    </div>
</body>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="{% static 'table1/employee/emp_create.js' %}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

</html>
