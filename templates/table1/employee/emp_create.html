<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    {% load static %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-md-6">
                <div class="text-center">
                    <h4>Register</h4>
                </div>
                <input type="hidden" id="e_id">

                <div class="mt-3">
                    <lbael for="emp_id"> ID</lbael>
                    <input type="text" id="emp_id" class="form-control" placeholder="write emp id" required />
                </div>
                <div class="mt-3">
                    <lbael for="emp_name"> NAME</lbael>
                    <input type="text" id="emp_name" class="form-control" placeholder="write emp name" required />
                </div>
                <div class="mt-3">
                    <lbael for="emp_degn">DESIGNATION</lbael>
                    <input type="text" id="emp_degn" class="form-control" placeholder="write your designation"
                        required />
                </div>
                <div class="mt-3">
                    <lbael for="emp_salary">SALARY</lbael>
                    <input type="text" id="emp_salary" class="form-control" placeholder="amount of salary" required />
                </div>
                <div class="mt-3">
                    <lbael for="emp_city">CITY</lbael>
                    <input type="text" id="emp_city" class="form-control" placeholder=" enter city name" required />
                </div>
                <div class="text-end">
                    <label for="emp_create"></label>
                    <button id="emp_create" class="btn btn-success mt-2">submit</button>
                </div>
            </div>
        </div>
    </div>
</body>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="{% static 'table1/employee/emp_create.js' %}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

</html>
