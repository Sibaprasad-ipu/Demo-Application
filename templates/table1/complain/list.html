<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
    {% load static %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-sm-12">
                <div class="text-center">
                    <h4>Complains List</h4>
                </div>
                <div class="table">
                    <table class="table table-bordered table-hover">
                        <thead>
                            <tr>
                                <th>NAME</th>
                                <th>EMAIL</th>
                                <th>MOBILE NO</th>
                                <th>CITY</th>
                                <th>ISSUE</th>
                                <th>TIME</th>
                                <th>IMAGE</th>
                                <th>ACTION</th>
                            </tr>
                        </thead>
                        <tbody id="complainBody"></tbody>

                    </table>
                    <div class="modal fade" id="complainModal" tabindex="-1">
                        <div class="modal-dialog">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h4 class="modal-title">Edit Complains</h4>
                                    <button class="btn-close" type="button" data-bs-dismiss="modal"></button>
                                </div>
                                <div class="modal-body">
                                    <input type="hidden" id="c_id">
                                    <div class="mt-3">
                                        <lbael for="name">NAME</lbael>
                                        <input type="text" id="name" class="form-control" placeholder="write your name"
                                            required />
                                    </div>
                                    <div class="mt-3">
                                        <lbael for="email">EMAIL</lbael>
                                        <input type="email" id="email" class="form-control"
                                            placeholder="write your email" required />
                                    </div>
                                    <div class="mt-3">
                                        <lbael for="mob">PHONE NO</lbael>
                                        <input type="text" id="mob" class="form-control"
                                            placeholder="write your phone no." required />
                                    </div>
                                    <div class="mt-3">
                                        <lbael for="city">CITY</lbael>
                                        <input type="text" id="city" class="form-control" placeholder="city name"
                                            required />
                                    </div>
                                    <div class="mt-3">
                                        <lbael for="issue">ISSUE</lbael>
                                        <input type="text" id="issue" class="form-control" placeholder="write issue"
                                            required />
                                    </div>
                                    <div class="mt-3">
                                        <lbael for="image">IMAGE</lbael>
                                        <input type="file" id="image" class="form-control" required />
                                    </div>
                                    <div class="mt-3">
                                        <lbael for="date">DATE</lbael>
                                        <input type="datetime-local" id="date" class="form-control" required />
                                    </div>
                                    <div class="text-end">
                                        <label for="c_update"></label>
                                        <button id="c_update" class="btn btn-success mt-2">update</button>
                                    </div>

                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</body>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="{% static 'table1/complain/create.js' %}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

</html>
