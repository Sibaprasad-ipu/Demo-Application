<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    {% load static %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-md-6">
                <div class="text-center">
                    <h4>Create Table</h4>
                </div>
                <input type="hidden" id="s_id">

                <div class="mt-3">
                    <lbael for="stu_id">STUDENT ID</lbael>
                    <input type="text" id="stu_id" class="form-control" placeholder="write book id" required />
                </div>
                <div class="mt-3">
                    <lbael for="stu_name">STUDENT NAME</lbael>
                    <input type="text" id="stu_name" class="form-control" placeholder="write book name" required />
                </div>
                <div class="mt-3">
                    <lbael for="stu_roll">STUDENT ROLL</lbael>
                    <input type="text" id="stu_roll" class="form-control" placeholder="write book amount" required />
                </div>
                <div class="mt-3">
                    <lbael for="stu_stream">STUDENT STREAM</lbael>
                    <input type="text" id="stu_stream" class="form-control" placeholder="amount of book isssue"
                        required />
                </div>
                <div class="mt-3">
                    <lbael for="stu_city">STUDENT CITY</lbael>
                    <input type="text" id="stu_city" class="form-control" placeholder=" book avialable" required />
                </div>
                <div class="text-end">
                    <label for="stu_create"></label>
                    <button type="button" id="stu_create" class="btn btn-success mt-2">submit</button>
                </div>
            </div>
        </div>
    </div>
</body>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="{% static 'table1/student/stu_create.js' %}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

</html>
