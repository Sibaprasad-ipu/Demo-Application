<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXPENSE</title>
    {% load static %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<div class="container">
    <div class="row">
        <div class="col-md-8">
            <div class="header">
                <h4>create expense list</h4>
            </div>
            <div class="mt-3">
                <label for="month">MONTH</label>
                <input type="text" id="month" class="form-control" placeholder="enter month name" required>
            </div>
            <div class="mt-3">
                <label for="allocate">ALLOCATE</label>
                <input type="text" id="allocate" class="form-control" placeholder="enter amount" required>
            </div>
            <div class="mt-3">
                <label for="grocery">GROCERY</label>
                <input type="text" id="grocery" class="form-control" placeholder="enter amount" required>
            </div>
            <div class="mt-3">
                <label for="shopping">SHOPPING</label>
                <input type="text" id="shopping" class="form-control" placeholder="enter amount" required>
            </div>
            <div class="mt-3">
                <label for="bill">BILL</label>
                <input type="text" id="bill" class="form-control" placeholder="enter amount" required>
            </div>
            <div class="mt-3">
                <label for="food">FOOD</label>
                <input type="text" id="food" class="form-control" placeholder="enter amount" required>
            </div>

            <div class="mt-3">
                <label for="travel">TRAVEL</label>
                <input type="text" id="travel" class="form-control" placeholder="enter amount" required>
            </div>
            <div class="mt-3">
                <label for="total">TOTAL</label>
                <input type="text" id="total" class="form-control" placeholder="enter amount" readonly>
            </div>
            <div class="mt-3">
                <label for="avl">SAVING</label>
                <input type="text" id="avl" class="form-control" placeholder="enter amount" readonly>
            </div>
            <div class="text-end">
                <button id="e_create" class="btn btn-primary mt-2">create</button>
            </div>
        </div>
    </div>
</div>

<body>

</body>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="{% static 'table1/expense/create.js' %}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

</html>
