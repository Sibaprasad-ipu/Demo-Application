<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
    {% load static %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <div class="text-center">
                    <h4>Register List</h4>
                </div>
                <div class="table">
                    <table class="table table-bordered table-hover">
                        <thead>
                            <tr>
                                <th>NAME</th>
                                <th>EMAIL</th>
                                <th>GENDER</th>
                                <th>DOB</th>
                                <th>CONTACT NO</th>
                                <th>CITY/VILLAGE</th>
                                <th>DIST</th>
                                <th>STATE</th>
                                <th>COUNTRY</th>
                                <th>PIC</th>
                                <th>ACTION</th>
                            </tr>
                        </thead>
                        <tbody id="registerBody"></tbody>

                    </table>
                    <div class="modal fade" id="registerModal" tabindex="-1">
                        <div class="modal-dialog">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h4 class="modal-title">Edit Details</h4>
                                    <button class="btn-close" type="button" data-bs-dismiss="modal"></button>
                                </div>
                                <div class="modal-body">
                                    <input type="hidden" id="r_id">
                                    <div class="mt-3">
                                        <lbael for="name">NAME</lbael>
                                        <input type="text" id="name" class="form-control" placeholder="write your name"
                                            required />
                                    </div>
                                    <div class="mt-3">
                                        <lbael for="email">EMAIL</lbael>
                                        <input type="email" id="email" class="form-control"
                                            placeholder="write your email" required />
                                    </div>
                                    <div class="mt-3">
                                        <lbael for="gender">GENDER</lbael>
                                        <input type="text" id="gender" class="form-control"
                                            placeholder="type your contact no" required />
                                    </div>
                                    <div class="mt-3">
                                        <lbael for="dob">DOB</lbael>
                                        <input type="date" id="dob" class="form-control"
                                            placeholder="type your contact no" required />
                                    </div>
                                    <div class="mt-3">
                                        <lbael for="mob_no">CONTACT NO.</lbael>
                                        <input type="text" id="mob_no" class="form-control"
                                            placeholder="type your contact no" required />
                                    </div>
                                    <div class="mt-3">
                                        <lbael for="city">CITY/VILLAGE</lbael>
                                        <input type="text" id="city" class="form-control"
                                            placeholder="write your city/village name." required />
                                    </div>
                                    <div class="mt-3">
                                        <lbael for="dist">DIST</lbael>
                                        <input type="text" id="dist" class="form-control"
                                            placeholder="write your city/village name." required />
                                    </div>
                                    <div class="mt-3">
                                        <lbael for="state">STATE</lbael>
                                        <input type="text" id="state" class="form-control"
                                            placeholder="enter state name" required />
                                    </div>
                                    <div class="mt-3">
                                        <lbael for="country">COUNTRY</lbael>
                                        <input type="text" id="country" class="form-control"
                                            placeholder="enter country name" required />
                                    </div>
                                    <div class="mt-3">
                                        <lbael for="pic">PROFILE IMAGE</lbael>
                                        <input type="file" id="pic" class="form-control" required />
                                    </div>
                                    <div class="text-end">
                                        <label for="update"></label>
                                        <button id="update" class="btn btn-success mt-2">update</button>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>
</body>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="{% static 'table1/register/create.js' %}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

</html>
