<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
    {% load static %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-md-10">
                <div class="text-center">
                    <h4>Mark List</h4>
                </div>
                <div class="table">
                    <table class="table table-bordered table-hover">
                        <thead>
                            <tr>
                                <th>NAME</th>
                                <th>ROLL</th>
                                <th>MATH</th>
                                <th>ENGLISH</th>
                                <th>SCIENCE</th>
                                <th>ODIA</th>
                                <th>HISTORY</th>
                                <th>GEOGRPHY</th>
                                <th>TOTAL</th>
                                <th>ACTION</th>
                            </tr>
                        </thead>
                        <tbody id="markBody"></tbody>

                    </table>
                    <div class="modal fade" id="marksModal" tabindex="-1">
                        <div class="modal-dialog">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h4 class="modal-title">EDIT MARKS</h4>
                                    <button class="btn-close" data-bs-dismiss="modal"></button>
                                </div>
                                <div class="modal-body">
                                    <input id="r_id" type="hidden">
                                    <div class="mt-3">
                                        <label for="r_name">NAME</label>
                                        <input type="text" id="r_name" class="form-control"
                                            placeholder="enter your name." required />
                                    </div>
                                    <div class="mt-3">
                                        <label for="r_roll">ROLL NO</label>
                                        <input type="text" id="r_roll" class="form-control"
                                            placeholder="enter your name." required />
                                    </div>
                                    <div class="mt-3">
                                        <label for="r_math">MATH</label>
                                        <input type="text" id="r_math" class="form-control"
                                            placeholder="enter your name." required />
                                    </div>
                                    <div class="mt-3">
                                        <label for="r_english">ENGLISH</label>
                                        <input type="text" id="r_english" class="form-control"
                                            placeholder="enter your name." required />
                                    </div>
                                    <div class="mt-3">
                                        <label for="r_science">SCIENCE</label>
                                        <input type="text" id="r_science" class="form-control"
                                            placeholder="enter your name." required />
                                    </div>
                                    <div class="mt-3">
                                        <label for="r_odia">ODIA</label>
                                        <input type="text" id="r_odia" class="form-control"
                                            placeholder="enter your name." required />
                                    </div>
                                    <div class="mt-3">
                                        <label for="r_history">HISTORY</label>
                                        <input type="text" id="r_history" class="form-control"
                                            placeholder="enter your name." required />
                                    </div>
                                    <div class="mt-3">
                                        <label for="r_geography">GEOGRPHY</label>
                                        <input type="text" id="r_geography" class="form-control"
                                            placeholder="enter your name." required />
                                    </div>
                                    <div class="mt-3">
                                        <label for="r_total">TOTAL</label>
                                        <input type="text" id="r_total" class="form-control"
                                            placeholder="enter your name." readonly />
                                    </div>
                                    <div class="text-end">
                                        <button class="btn btn-success mt-2" id="r_update">update</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</body>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="{% static 'table1/marks/create.js' %}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

</html>
