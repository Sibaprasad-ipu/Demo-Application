<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
    {% load static %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-sm-12">
                <div class="text-center">
                    <h4 class="moddal-title">Customer Details</h4>
                </div>
                <div class="table">
                    <table class="table table-bordered table-hover">
                        <thead>
                            <tr>
                                <th>NAME</th>
                                <th>EMAIL</th>
                                <th>USER ID</th>
                                <th>ACCOUNT NO</th>
                                <th>PHONE NO</th>
                                <th>CITY</th>
                                <th>ACCOUNT TYPE</th>
                                <th>PICS</th>
                                <th>ACTION</th>
                            </tr>
                        </thead>
                        <tbody id="bankBody"></tbody>

                    </table>
                    <div class="modal fade" id="bankModal" tabindex="-1">
                        <div class="modal-dialog">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h4 class="modal-title">Edit Details</h4>
                                    <button class="btn-close" data-bs-dismiss="modal" type="button"></button>
                                </div>
                                <div class="modal-body">
                                    <input type="hidden" id="b_id">

                                    <div class="mt-2">
                                        <lbael for="user">NAME</lbael>
                                        <input type="text" id="user" class="form-control" placeholder="write your name"
                                            required />
                                    </div>
                                    <div class="mt-2">
                                        <lbael for="email">EMAIL</lbael>
                                        <input type="text" id="email" class="form-control" placeholder="write email"
                                            required />
                                    </div>
                                    <div class="mt-2">
                                        <lbael for="phone">PHONE NO.</lbael>
                                        <input type="text" id="phone" class="form-control" placeholder="write phone no"
                                            required />
                                    </div>
                                    <div class="mt-2">
                                        <lbael for="home">CITY</lbael>
                                        <input type="text" id="home" class="form-control" placeholder="write city name"
                                            required />
                                    </div>
                                    <div class="mt-2">
                                        <lbael for="user_id">USER ID</lbael>
                                        <input type="text" id="user_id" class="form-control" placeholder=" state name"
                                            required />
                                    </div>
                                    <div class="mt-2">
                                        <lbael for="ac_no">ACCOUNT NO</lbael>
                                        <input type="text" id="ac_no" class="form-control" placeholder="country name"
                                            required />
                                    </div>
                                    <div class="mt-2">
                                        <lbael for="ac_type">ACCOUNT TYPE</lbael>
                                        <input type="text" id="ac_type" class="form-control" placeholder="country name"
                                            required />
                                    </div>
                                    <div class="mt-2">
                                        <lbael for="pics">IMAGE</lbael>
                                        <input type="file" id="pics" class="form-control" placeholder="country name"
                                            required />
                                    </div>
                                    <div class="text-end">
                                        <label for="b_update"></label>
                                        <button id="b_update" class="btn btn-success mt-2">update</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</body>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="{% static 'table1/bank/create.js' %}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

</html>
