<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
    {% load static %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body>
    <div class="container border rounded-3" style="width: 30%; margin-top:100px;background-color: rgb(148, 213, 232);">
        <div class="row">
            <div class="col-md-11 ms-3">
                <div class="text-center">
                    <h4>Login</h4>
                </div>
                <div class="mt-3">
                    <label for="name"><strong>NAME</strong></label>
                    <input type="text" class="form-control" placeholder="enter username" id="name">
                </div>
                <div class="mt-3">
                    <label for="password"><strong>PASSWORD</strong></label>
                    <div class="input-group">
                        <input type="password" id="password" placeholder="enter password" class="form-control" required>
                        <span class="input-group-text">
                            <i class="bi bi-eye-slash togglePassword" data-target="#password"></i>
                        </span>

                    </div>
                </div>
                <div class="row mt-2">
                    <label for="captcha"><strong>captcha</strong></label>
                    <div class="d-flex align-items-center gap-2">
                        <span id="captchaText" class="border p-2"></span>
                        <button class="btn btn-secondary" id="refreshCaptcha">
                            <i class="bi bi-arrow-clockwise"></i>
                        </button>
                        <input type="text" id="captchaInput">
                    </div>

                </div>
                <div class="text-end">
                    <button class="btn btn-success mt-2 mb-1" id="login">login</button>
                </div>
            </div>
        </div>
    </div>
</body>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="{% static 'table1/bank/create.js' %}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

</html>
