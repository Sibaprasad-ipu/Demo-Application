<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BANK</title>
    {% load static %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container border rounded-1" style="width: 40%; margin-top: 80px;background-color: rgb(153, 195, 232); ">
        <div class="row ms-3">
            <div class="col-md-11">
                <div class="text-center">
                    <h4>Create Profile</h4>
                </div>
                <input type="hidden" id="p_id">

                <div class="mt-2">
                    <label for="user">NAME</label>
                    <input type="text" id="user" class="form-control" placeholder="write your name" required />
                </div>
                <div class="mt-2">
                    <label for="email">EMAIL</label>
                    <input type="text" id="email" class="form-control" placeholder="write email" required />
                </div>
                <div class="mt-2">
                    <label for="phone">PHONE NO.</label>
                    <input type="text" id="phone" class="form-control" placeholder="write phone no" required />
                </div>
                <div class="mt-2">
                    <label for="home">CITY</label>
                    <input type="text" id="home" class="form-control" placeholder="write city name" required />
                </div>
                <div class="mt-2">
                    <label for="user_id">USER ID</label>
                    <input type="text" id="user_id" class="form-control" placeholder=" state name" required />
                </div>
                <div class="mt-2">
                    <label for="ac_no">ACCOUNT NO</label>
                    <input type="text" id="ac_no" class="form-control" placeholder="country name" required />
                </div>
                <div class="row mt-2">
                    <div class="col-md-6">
                        <label for="ac_type">ACCOUNT TYPE</label>
                        <select id="ac_type">
                            <option>select</option>
                            <option value="saving">saving</option>
                            <option value="current">current</option>
                            <option value="salary">salary</option>
                            <option value="loan">loan</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="pics">IMAGE</label>
                        <input type="file" id="pics" class="form-control" placeholder="country name" required />
                    </div>
                </div>
                <div class="text-end">
                    <label for="b_create"></label>
                    <button id="b_create" class="btn btn-success mt-2 mb-1">submit</button>
                </div>
            </div>
        </div>
    </div>
</body>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="{% static 'table1/bank/create.js' %}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

</html>
