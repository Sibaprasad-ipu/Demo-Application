<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIODATA</title>
    {% load static %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container border  rounded-2"
        style="width: 40%; background-color: rgb(186, 213, 236);margin-top: 100px;">
        <div class="row">
            <div class="col-md-11 ms-3">
                <div class="text-center">
                    <h2 class="title" style="font-style: italic;">CREATE BIODATA</h2>
                </div>
                <input type="hidden">
                <div class="mt-3">
                    <label for="b_name"><strong>NAME</strong></label>
                    <input type="text" id="b_name" class="form-control" placeholder="write your name" required />
                </div>

                <div class="mt-3">
                    <label for="b_city"><strong>CITY</strong></label>
                    <input type="text" id="b_city" class="form-control" placeholder="write your city" required />
                </div>
                <div class=" row mt-3">
                    <div class="col-md-6">
                        <label for="b_age"><strong>AGE</strong></label>
                        <input type="text" id="b_age" class="form-control" placeholder="write your age" required />
                    </div>
                    <div class="col-md-6">
                        <label for="b_dob"><strong>DOB</strong></label>
                        <input type="date" id="b_dob" class="form-control" placeholder="write your name" required />
                    </div>
                </div>


                <div class="row mt-3">
                    <div class="col-md-6">
                        <label for="b_gender">
                            <strong>GENDER</strong>
                        </label>
                        <div class="dropdown">
                            <select id="b_gender">
                                <option>select</option>
                                <option value="male">male</option>
                                <option value="female">female</option>
                                <option value="others">others</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label for="b_pic"><strong>IMAGE</strong></label>
                        <input type="file" id="b_pic" class="form-control" required />
                    </div>
                </div>
                <div class="mt-3">
                    <div class="text-end">
                        <button id="b_create" class="btn btn-info mb-1" type="button">submit</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="{% static 'table1/biodata/create.js' %}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

</html>
