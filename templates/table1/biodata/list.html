<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
    {% load static %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-md-6">
                <div class="text-center">
                    <h4>BIODATA</h4>
                </div>
                <div class="table">
                    <table class="table table-bordered table-hover">
                        <thead>
                            <tr>
                                <th>NAME</th>
                                <th>AGE</th>
                                <th>GENDER</th>
                                <th>CITY</th>
                                <th>DOB</th>
                                <th>IMAGE</th>
                                <th>ACTION</th>
                            </tr>
                        </thead>
                        <tbody id="bBody"></tbody>

                    </table>
                    <div class="modal fade" id="biodataModal" tabindex="-1">
                        <div class="modal-dialog">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h4 class="modal-title">Edit Biodata</h4>
                                    <button class="btn-close" type="button" data-bs-dismiss="modal"></button>
                                </div>
                                <div class="modal-body">
                                    <input id="b_id" type="hidden">
                                    <div class="mt-3">
                                        <label for="b_name">NAME</label>
                                        <input id="b_name" class="form-control" type="text" required>
                                    </div>
                                    <div class="mt-3">
                                        <label for="b_age">AGE</label>
                                        <input id="b_age" class="form-control" type="text" required>
                                    </div>
                                    <div class="mt-3">
                                        <div class="dropdown">
                                            <label for="b_gender">GENDER</label>
                                            <select id="b_gender">
                                                <option value="male">male</option>
                                                <option value="female">female</option>
                                                <option value="others">others</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="mt-3">
                                        <label for="b_city">CITY</label>
                                        <input id="b_city" class="form-control" type="text" required>
                                    </div>
                                    <div class="mt-3">
                                        <label for="b_dob">DOB</label>
                                        <input id="b_dob" class="form-control" type="date" required>
                                    </div>
                                    <div class="mt-3">
                                        <label for="b_pic">IMAGE</label>
                                        <input id="b_pic" class="form-control" type="file" required>
                                    </div>
                                    <div class="text-end">
                                        <button class="btn btn-info mt-2" type="button"
                                            id="biodata_update">update</button>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>
</body>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="{% static 'table1/biodata/create.js' %}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

</html>
