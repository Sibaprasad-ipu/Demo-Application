<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOME</title>
    {% load static %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>

<body>
    <div class="container mt-3">
        <div class="row">
            <div class="col-md-8">
                <div class="text-center">
                    <h4>REGISTER</h4>
                </div>
                <div class="mt-3">
                    <label for="f_name">FIRST NAME:</label>
                    <input id="f_name" type="text" class="form-control" placeholder="enter first name.">
                </div>
                <div class="mt-3">
                    <label for="l_name">LAST NAME:</label>
                    <input id="l_name" type="text" class="form-control" placeholder="enter last name.">
                </div>
                <div class="mt-3">
                    <label for="full_name">FULL NAME:</label>
                    <input id="full_name" type="text" class="form-control" placeholder="enter first name." readonly>
                </div>
                <div class="mt-3">
                    <label for="password">PASSWORD :</label>
                    <input id="password" type="text" class="form-control" placeholder="enter password.">
                </div>
                <div class="text-end">
                    <button id="create" class="btn btn-success mt-2">create</button>
                </div>
            </div>
        </div>
    </div>

</body>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="{% static 'home/home.js' %}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

</html>
