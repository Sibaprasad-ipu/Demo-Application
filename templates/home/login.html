<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN</title>
    {% load static %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

</head>

<body>

    <div class="container  border">
        <div class="row">
            <div class="col-md-12">
                <div class="text-center">
                    <h4 class="header">LOGIN</h4>
                </div>
                <div class="mt-3">
                    <label for="username"><strong>USERNAME</strong></label>
                    <input type="text" class="form-control" placeholder="enter username." id="username" required />
                </div>
                <div class="mt-3">
                    <label for="password"><strong>PASSWORD </strong></label>
                    <div class="input-group">
                        <input type="password" class="form-control" placeholder="enter password" id="password"
                            required />
                        <span class="input-group-text">
                            <i class="bi bi-eye-slash togglePassword" data-target="#password"
                                style="cursor: pointer;"></i>
                        </span>
                    </div>
                </div>
                <div class="mt-3">
                    <label for="captcha"><strong>CAPTCHA</strong></label>
                    <div class="d-flex align-items-center gap-2">
                        <span id="captchaText" class="border p-2 bg-light"></span>
                        <button type="button" id="refreshCaptcha" class="btn btn-secondary">
                            <i class="bi bi-arrow-clockwise"></i>
                        </button>
                    </div>
                    <input type="text" class="form-control mt-2" id="captchaInput" placeholder="Enter captcha" required>
                </div>
                <div class="text-end">
                    <button class="btn btn-success mt-2 mb-2" id="submit"><strong>login</strong></button>
                </div>
            </div>
        </div>
    </div>

</body>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="{% static 'home/login.js' %}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

</html>
