<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profiles</title>
    {% load static %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'css/profiles.css' %}">

</head>

<body>
    <div class="container">
        <div class="justify-content-center">
            <div class="row">
                <div class="col-md-4 mt-2 mb-4">
                    <div class="card shadow" id="profileCard">

                        <div class="card-body" style="background-color: rgb(234, 182, 227);">
                            <div class="text-center">
                                <img id="p_pic" class="card-img-top rounded-circle "
                                    style="height: 250px;width: 250px; object-fit: cover;">
                            </div>
                            <div class="ms-4">
                                <input type="hidden" id="p_id">
                                <h5 class="card-title"></h5>
                                <p><strong>NAME : </strong><span id="p_name"></span></p>
                                <p><strong> EMAIl : </strong><span id="p_email"></span> </p>
                                <p><strong> PASSWORD : </strong><span id="p_password"></span> </p>
                                <p><strong>F NAME : </strong><span id="p_fname"></span></p>
                                <p><strong>L NAME : </strong><span id="p_lname"></span></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="{% static 'profile/profiles.js' %}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

</html>
