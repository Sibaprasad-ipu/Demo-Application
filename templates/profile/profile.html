<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    {% load static %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container mt-4 rounded-2 border"
        style="width: 500px; height: 550px; background-color: rgb(228, 202, 188);">
        <div class="row">
            <div class="col-md-12">
                <div class="mt-3">
                    <laabel for="fname"><strong>FIRST NAME :</strong></laabel>
                    <input type="text" id="fname" placeholder="Enter your first name." class="form-control" name="fname"
                        required />
                </div>
                <div class="mt-3">
                    <laabel for="lname"><strong>LAST NAME :</strong></laabel>
                    <input type="text" id="lname" placeholder="Enter your last  name." class="form-control" name="lname"
                        required />
                </div>
                <div class="mt-3">
                    <laabel for="name"><strong>NAME :</strong></laabel>
                    <input type="text" id="name" placeholder="Enter your name." class="form-control" name="name"
                        readonly>
                </div>
                <div class="mt-3">
                    <laabel for="gmail"><strong>EMAIL :</strong></laabel>
                    <input type="text" id="gmail" placeholder="Enter your gmail." class="form-control" name="gmail"
                        required />
                </div>
                <div class="mt-3">
                    <laabel for="password"><strong>PASSWORD :</strong></laabel>
                    <input type="password" id="password" placeholder="Enter your password." class="form-control"
                        name="password" required />
                </div>

                <div class="mt-3">
                    <label for="attachment"><strong>PROFILE PIC :</strong></label>
                    <input type="file" id="attachment" class="form-control" required />
                </div>
                <div class="text-end">
                    <button type="button" id="submit" class="btn btn-info mb-2 mt-3"><strong>submit</strong></button>
                </div>
            </div>
        </div>
    </div>
</body>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="{% static 'profile/profile.js' %}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

</html>
